
name: Deploy StockPilot to Lightsail

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Lightsail via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            cd /home/ubuntu/stockpilot

            echo "Fetching latest StockPilot code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Checking production Docker configuration..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

            echo "Stopping existing services..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml down

            echo "Building backend..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build backend

            echo "Starting database..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d db

            echo "Applying database migrations..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm backend alembic upgrade head

            echo "Building frontend..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build frontend

            echo "Starting StockPilot..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            echo "Checking HTTPS application health..."
            for i in $(seq 1 12); do
              if curl -kfsS https://localhost/api/v1/health; then
                echo "StockPilot HTTPS deployment successful."
                exit 0
              fi
              sleep 5
            done

            echo "HTTPS health check failed."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
            exit 1